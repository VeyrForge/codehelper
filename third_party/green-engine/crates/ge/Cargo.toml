[package]
name = "ge"
version = "1.1.1"
edition = "2021"
description = "Green Engine CLI — run, compress (via Green Compress), and manage local LLMs"
license = "BUSL-1.1"

[dependencies]
engine-core = { path = "../engine-core" }
serde_json = "1.0.140"

[features]
default = []
gpu = ["engine-core/gpu"]

[[bin]]
name = "ge"
path = "src/main.rs"

# Shells out to curl/git/make/greencompress/llama.cpp; links engine-core for .green routing.
